[build]
  command = "bash scripts/ensure-rust.sh && npm run build:reports"
  publish = "reports-dist"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["rust/pkg/engine/*.wasm"]
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
