name: Publish student timetable
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: app
        with:
          path: |
            dist
            rust/pkg
          key: rust-app-${{ runner.os }}-${{ github.sha }}
      - uses: actions/cache@v4
        if: steps.app.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: bash scripts/ensure-rust.sh
        if: steps.app.outputs.cache-hit != 'true'
      - run: npm run build
        if: steps.app.outputs.cache-hit != 'true'
      - run: npm test
        if: steps.app.outputs.cache-hit != 'true'
      - run: node scripts/update-air-quality.mjs
      - run: cp public/data/air-quality.json dist/data/air-quality.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
