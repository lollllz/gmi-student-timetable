[workspace]
members = ["rust/core", "rust/web", "rust/engine"]
resolver = "2"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
sha2 = "0.10"
encoding_rs = "0.8"
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
js-sys = "=0.3.82"
web-sys = "=0.3.82"
serde-wasm-bindgen = "0.6"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
